name: Stray
options:
  bundleIdPrefix: com.simonescheuer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Stray:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - Stray
    dependencies:
      - sdk: HealthKit.framework
        weak: true
    # capabilities:
    #   iCloud:
    #     cloudKit:
    #       containers:
    #         - iCloud.com.simonescheuer.stray
    #   HealthKit: true
    # NOTE: Uncomment when enrolled in Apple Developer Program
    info:
      path: Stray/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Stray uses your location to reveal the parts of your world you've explored."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Always-on location lets Stray track your exploration even when the app is in the background, so you never miss a step."
        NSPhotoLibraryUsageDescription: "Stray reads photo locations to show your photos on explored tiles and reveal places you've already been."
        NSPhotoLibraryAddUsageDescription: "Stray saves photos you take during exploration to your camera roll."
        NSCameraUsageDescription: "Stray uses the camera so you can capture moments during exploration."
        NSHealthShareUsageDescription: "Stray uses Health data to show accurate step counts and walking distance. You can skip this — we'll estimate from GPS instead."
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonescheuer.stray
        SWIFT_VERSION: "5.9"
    entitlements:
      path: Stray/Stray.entitlements
