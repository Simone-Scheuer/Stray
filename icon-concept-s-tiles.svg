<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#08080f"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <g filter="url(#outerGlow)" opacity="0.25">
    <rect x="300" y="200" width="424" height="624" rx="20" fill="#5BB868"/>
  </g>

  <g filter="url(#glow)">
    <!-- S built from ~50px tiles with 4px gaps -->
    <!-- Grid: x steps of 54, y steps of 54 -->

    <!-- Row 1: top of S (4 tiles across) -->
    <rect x="398" y="190" width="50" height="50" rx="6" fill="#E8C840" opacity="0.75"/>
    <rect x="452" y="190" width="50" height="50" rx="6" fill="#E8C840" opacity="0.8"/>
    <rect x="506" y="190" width="50" height="50" rx="6" fill="#E8C840" opacity="0.85"/>
    <rect x="560" y="190" width="50" height="50" rx="6" fill="#E8C840" opacity="0.8"/>

    <!-- Row 2: left side drops down -->
    <rect x="344" y="244" width="50" height="50" rx="6" fill="#E8C840" opacity="0.65"/>
    <rect x="398" y="244" width="50" height="50" rx="6" fill="#A8C444" opacity="0.8"/>

    <!-- Row 3 -->
    <rect x="344" y="298" width="50" height="50" rx="6" fill="#A8C444" opacity="0.7"/>

    <!-- Row 4: middle bar of S (4 tiles) -->
    <rect x="398" y="352" width="50" height="50" rx="6" fill="#A8C444" opacity="0.75"/>
    <rect x="452" y="352" width="50" height="50" rx="6" fill="#5BB868" opacity="0.85"/>
    <rect x="506" y="352" width="50" height="50" rx="6" fill="#5BB868" opacity="0.9"/>
    <rect x="560" y="352" width="50" height="50" rx="6" fill="#5BB868" opacity="0.8"/>

    <!-- Row 5: right side drops down -->
    <rect x="560" y="406" width="50" height="50" rx="6" fill="#3DA5A5" opacity="0.8"/>
    <rect x="614" y="406" width="50" height="50" rx="6" fill="#3DA5A5" opacity="0.65"/>

    <!-- Row 6 -->
    <rect x="614" y="460" width="50" height="50" rx="6" fill="#3DA5A5" opacity="0.7"/>

    <!-- Row 7: bottom bar of S (4 tiles) -->
    <rect x="398" y="514" width="50" height="50" rx="6" fill="#4577D9" opacity="0.8"/>
    <rect x="452" y="514" width="50" height="50" rx="6" fill="#4577D9" opacity="0.85"/>
    <rect x="506" y="514" width="50" height="50" rx="6" fill="#4577D9" opacity="0.9"/>
    <rect x="560" y="514" width="50" height="50" rx="6" fill="#4577D9" opacity="0.75"/>

    <!-- Fragments splitting off -->
    <rect x="620" y="190" width="38" height="38" rx="5" fill="#E8C840" opacity="0.35"/>
    <rect x="670" y="200" width="28" height="28" rx="4" fill="#E8C840" opacity="0.18"/>

    <rect x="290" y="280" width="38" height="38" rx="5" fill="#A8C444" opacity="0.3"/>
    <rect x="248" y="260" width="28" height="28" rx="4" fill="#A8C444" opacity="0.15"/>

    <rect x="670" y="440" width="38" height="38" rx="5" fill="#3DA5A5" opacity="0.3"/>
    <rect x="715" y="465" width="28" height="28" rx="4" fill="#3DA5A5" opacity="0.15"/>

    <rect x="340" y="514" width="38" height="38" rx="5" fill="#4577D9" opacity="0.35"/>
    <rect x="295" y="530" width="28" height="28" rx="4" fill="#4577D9" opacity="0.18"/>

    <!-- Micro particles -->
    <rect x="700" y="180" width="18" height="18" rx="3" fill="#E8C840" opacity="0.12"/>
    <rect x="230" y="300" width="18" height="18" rx="3" fill="#5BB868" opacity="0.1"/>
    <rect x="740" y="480" width="18" height="18" rx="3" fill="#3DA5A5" opacity="0.1"/>
    <rect x="265" y="550" width="18" height="18" rx="3" fill="#4577D9" opacity="0.12"/>
  </g>
</svg>
